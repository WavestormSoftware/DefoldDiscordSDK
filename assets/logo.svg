<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">DefoldDiscordSDK</title>
  <desc id="logo-desc">Original mark for DefoldDiscordSDK: a near-black rounded tile carrying a bold electric-blue letter D whose counter is an abstract chat bubble with a downward tail, crossed in the lower third by a single thin cyan wave crest. Not affiliated with Discord or Defold; all shapes drawn from scratch.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252B"/>
      <stop offset="1" stop-color="#1B1D21"/>
    </linearGradient>
    <linearGradient id="dee" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3F75FF"/>
      <stop offset="1" stop-color="#2477EB"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <!-- letter D: outer silhouette with an even-odd counter carved as an abstract
       speech bubble (rounded body, tail dipping toward the bottom-left) -->
  <path fill="url(#dee)" fill-rule="evenodd" d="
    M144,112 H284
    A144,144 0 0 1 284,400
    H144
    Q124,400 124,380
    V132
    Q124,112 144,112
    Z
    M230,190
    H322
    Q346,190 346,214
    V294
    Q346,318 322,318
    H306
    L284,364
    L246,318
    H230
    Q206,318 206,294
    V214
    Q206,190 230,190
    Z"/>

  <!-- single thin wave crest, Wavestorm Software nod -->
  <path d="M56,464 C128,416 196,416 264,448 C332,480 396,476 456,438"
        fill="none" stroke="#33C3F0" stroke-opacity="0.95"
        stroke-width="11" stroke-linecap="round"/>
</svg>
