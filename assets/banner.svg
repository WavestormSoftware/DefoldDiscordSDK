<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">DefoldDiscordSDK</title>
  <desc id="banner-desc">Banner for DefoldDiscordSDK, the Discord Social SDK extension for Defold. Original near-black composition with an electric-blue D mark whose counter is an abstract chat bubble, thin cyan wave lines, the module wordmark, subtitle, feature tag, and a footer crediting Wavestorm Software. All graphics are original.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="1" stop-color="#1A1D22"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252B"/>
      <stop offset="1" stop-color="#1B1D21"/>
    </linearGradient>
    <linearGradient id="dee" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3F75FF"/>
      <stop offset="1" stop-color="#2477EB"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- 2-3 thin diagonal wave lines crossing the layout -->
  <g fill="none" stroke="#33C3F0" stroke-linecap="round">
    <path d="M-40,342 C200,244 380,244 560,174 C740,104 900,116 1090,64 C1180,40 1240,34 1320,30" stroke-opacity="0.28" stroke-width="3.5"/>
    <path d="M-40,420 C200,322 380,322 560,252 C740,182 900,194 1090,142 C1180,118 1240,112 1320,108" stroke-opacity="0.18" stroke-width="2.5"/>
    <path d="M-40,262 C200,164 380,164 560,94 C760,18 940,44 1320,18" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- faint oversized geometric D watermark, offset behind the wordmark -->
  <g transform="translate(936,-150) scale(1.6)" fill="none" stroke="#7FA4FF"
     stroke-opacity="0.055" stroke-width="17" stroke-linejoin="round">
    <path d="M144,112 H284 A144,144 0 0 1 284,400 H144 Q124,400 124,380 V132 Q124,112 144,112 Z"/>
  </g>

  <!-- logo mark (same geometry as assets/logo.svg) -->
  <g transform="translate(88 50) scale(0.586)">
    <rect width="512" height="512" rx="112" fill="url(#tile)"/>
    <path fill="url(#dee)" fill-rule="evenodd" d="
      M144,112 H284
      A144,144 0 0 1 284,400
      H144
      Q124,400 124,380
      V132
      Q124,112 144,112
      Z
      M230,190
      H322
      Q346,190 346,214
      V294
      Q346,318 322,318
      H306
      L284,364
      L246,318
      H230
      Q206,318 206,294
      V214
      Q206,190 230,190
      Z"/>
    <path d="M56,464 C128,416 196,416 264,448 C332,480 396,476 456,438"
          fill="none" stroke="#33C3F0" stroke-opacity="0.95"
          stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="448" y="178" font-size="68" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">Defold<tspan fill="#3F75FF">DiscordSDK</tspan></text>
    <text x="450" y="234" font-size="30" font-weight="500" fill="#A9B4C8">Discord Social SDK for Defold</text>
    <text x="450" y="288" font-size="20" font-weight="500" letter-spacing="2.5" fill="#8C95A9">rich presence, invites, lobbies, friends, voice</text>
  </g>

  <!-- discreet footer: small original wave accent + credit line -->
  <g>
    <path d="M88,372 C96,361 104,361 112,369 C117,374 122,374 128,368"
          fill="none" stroke="#33C3F0" stroke-opacity="0.8" stroke-width="2.6" stroke-linecap="round"/>
    <text x="146" y="376" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#8A93A6">Built by Wavestorm Software</text>
  </g>
</svg>
