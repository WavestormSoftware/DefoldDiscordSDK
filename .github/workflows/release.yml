name: release

# Publishes a GitHub release with the Defold library zip whenever a version
# tag is pushed (v1.2.3 or 1.2.3). The zip is the tag's tracked source code
# (game.project + defolddiscordsdk/) - Defold compiles the extension sources
# itself when a consuming project builds; no build server is used here.

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: verify and publish source library zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! echo "$TAG" | grep -Eq '^(v)?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' is not a supported version tag (x.y.z or vx.y.z)."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "zip=DefoldDiscordSDK-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "checksums=SHA256SUMS-${VERSION}.txt" >> "$GITHUB_ENV"

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ lua5.1

      - name: Quality gates (syntax, capi, lua, docs, license)
        run: |
          bash scripts/ci/syntax.sh
          bash scripts/ci/capi_check.sh
          bash scripts/ci/lua.sh
          python3 scripts/ci/docs_check.py
          python3 scripts/ci/license_audit.py

      - name: Pack the Defold library zip
        run: |
          set -e
          git archive --format=zip --output="$zip" "$tag"
          python3 scripts/ci/check_library_zip.py "$zip"
          sha256sum "$zip" > "$checksums"
          ls -la "$zip" "$checksums"

      - name: Extract release notes from the changelog
        run: |
          python3 scripts/ci/release_notes.py "$version" "$tag" \
            "${{ github.repository }}" > release-notes.md
          echo "-- release notes preview:"
          head -12 release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "DefoldDiscordSDK $tag" \
            --notes-file release-notes.md \
            --latest \
            "$zip" "$checksums"

      - name: Write dependency link to the job summary
        run: |
          REPO="${{ github.repository }}"
          {
            echo "### Defold dependency URL for $tag"
            echo ""
            echo "https://github.com/$REPO/archive/refs/tags/$tag.zip"
          } >> "$GITHUB_STEP_SUMMARY"
