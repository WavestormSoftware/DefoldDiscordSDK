[defolddiscordsdk]
group = Runtime
title = Defold Discord SDK
help = Settings for the DefoldDiscordSDK extension. The Discord application id is required for account linking, friends, invites and lobbies. The SDK library location is optional when the binaries are staged with the fetch tool.

application_id.type = string
application_id.label = Application id
application_id.help = Your Discord application id from the Developer Portal (App, then General Information). Leave empty for presence-only mode against a running Discord desktop client.
application_id.default =

lib_path.type = string
lib_path.label = Discord SDK library location
lib_path.help = Optional folder that holds the Discord Social SDK libraries (discord_partner_sdk plus the optional discord_krisp library next to it). Leave empty when the fetch tool has staged the binaries under defolddiscordsdk/res/<platform>/; the loader searches there automatically.
lib_path.default =

steam_app_id.type = string
steam_app_id.label = Steam app id
steam_app_id.help = Optional Steam app id. When set, Discord works with your Steam identity for social features.
steam_app_id.default =

default_redirect.type = string
default_redirect.label = OAuth redirect URL
default_redirect.help = Optional redirect URL used by the browser based authorization flow. Leave empty to use the platform default.
default_redirect.default =

scopes.type = string
scopes.label = OAuth scopes
scopes.help = Space separated OAuth scopes requested during account linking, for example: presence identify relationships
scopes.default = presence

auto_register_launch.type = bool
auto_register_launch.label = Register launches with Discord
auto_register_launch.help = Register game launches with Discord so invites and joinable parties work from the Discord client.
auto_register_launch.default = 1
